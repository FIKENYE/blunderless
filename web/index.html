<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blunderless</title>

  <!-- Departure Mono (modern terminal font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Departure+Mono&display=swap" rel="stylesheet" />

  <!-- chess.js: board logic (move validation, FEN, PGN parsing) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- Chessboard.js: interactive board rendering via CDN -->
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">blunderless</span>
    <div class="topbar-controls">
      <input id="chesscom-input" class="text-input" type="text"
             placeholder="chess.com username" autocomplete="off" />
      <button id="chesscom-btn" class="btn btn-secondary">load games</button>
    </div>
  </header>

  <main class="workspace">
    <!-- ── LEFT: Eval Bar ── -->
    <aside class="eval-panel">
      <div class="eval-bar-wrap">
        <div class="eval-bar-track">
          <div id="eval-black-fill" class="eval-fill eval-fill-black"></div>
          <div id="eval-white-fill" class="eval-fill eval-fill-white" style="height:50%"></div>
        </div>
        <div id="eval-label-top" class="eval-label eval-label-top">0.0</div>
        <div id="eval-label-bot" class="eval-label eval-label-bot">0.0</div>
      </div>
    </aside>

    <!-- ── CENTRE: Board + controls ── -->
    <section class="board-panel">
      <div class="board-header">
        <span id="player-black" class="player-tag">Black</span>
      </div>

      <div id="board" class="chess-board"></div>

      <div class="board-header">
        <span id="player-white" class="player-tag">White</span>
      </div>

      <div class="nav-controls">
        <button id="btn-start"  class="nav-btn" title="Go to start">⏮</button>
        <button id="btn-prev"   class="nav-btn" title="Previous move">◀</button>
        <button id="btn-next"   class="nav-btn" title="Next move">▶</button>
        <button id="btn-end"    class="nav-btn" title="Go to end">⏭</button>
        <button id="btn-flip"   class="nav-btn" title="Flip board">⇅</button>
      </div>

      <!-- PGN / FEN input -->
      <div class="input-panel">
        <textarea id="pgn-input" class="pgn-textarea"
                  placeholder="Paste a PGN or FEN here…" rows="4"></textarea>
        <button id="analyse-btn" class="btn btn-primary">analyse</button>
        <div id="status-msg" class="status-msg"></div>
      </div>
    </section>

    <!-- ── RIGHT: Move list + games list ── -->
    <aside class="side-panel">
      <div class="panel-tabs">
        <button class="tab-btn active" data-tab="moves">moves</button>
        <button class="tab-btn" data-tab="games">games</button>
      </div>

      <!-- Move list -->
      <div id="tab-moves" class="tab-content active">
        <div id="game-headers" class="game-headers hidden"></div>
        <table id="move-table" class="move-table">
          <thead>
            <tr>
              <th>#</th>
              <th>White</th>
              <th>Black</th>
            </tr>
          </thead>
          <tbody id="move-tbody"></tbody>
        </table>
        <div id="empty-moves" class="empty-state">
          No game loaded yet.<br/>Paste a PGN or FEN above.
        </div>
      </div>

      <!-- Chess.com recent games -->
      <div id="tab-games" class="tab-content hidden">
        <div id="games-list" class="games-list">
          <div class="empty-state">Enter a Chess.com username to load games.</div>
        </div>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
