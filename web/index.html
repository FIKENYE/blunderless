<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blunderless</title>

  <!-- Departure Mono via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Departure+Mono&display=swap" rel="stylesheet" />

  <!-- chess.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- Chessboard.js -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <link rel="stylesheet" href="/static/styles.css?v=3" />
</head>

<body>
  <header class="topbar">
    <span class="logo">BLUNDERLESS</span>
    <div class="topbar-controls">
      <input id="chesscom-input" class="text-input" type="text" placeholder="chess.com username" autocomplete="off" />
      <button id="chesscom-btn" class="btn btn-secondary">LOAD GAMES</button>
    </div>
  </header>

  <main class="workspace">

    <!-- ══ Left Stage: Centered Board + Eval Bar + Aligned Player Bars ══ -->
    <section class="left-stage">
      <div class="board-stack">

        <!-- Top Player Bar (aligned to board left & right edges) -->
        <div class="player-bar" id="top-player-bar">
          <div class="player-id">
            <span class="player-avatar avatar-black" id="top-avatar">B</span>
            <span id="top-name" class="player-name">Black</span>
            <span id="top-rating" class="player-rating"></span>
          </div>
          <div id="top-clock" class="player-clock">--:--</div>
        </div>

        <!-- Board Row: 28px Eval Bar + 8px Gap + 1:1 8x8 Board -->
        <div class="board-row">
          <aside class="eval-bar-shell" id="eval-bar-shell" aria-label="Evaluation bar">
            <div id="eval-black-fill" class="eval-fill eval-fill-black" style="height: 50%"></div>
            <div id="eval-white-fill" class="eval-fill eval-fill-white" style="height: 50%"></div>
            <span id="eval-label-top" class="eval-score eval-score-top"></span>
            <span id="eval-label-bot" class="eval-score eval-score-bot">+0.2</span>
          </aside>

          <div id="board" class="chess-board"></div>
        </div>

        <!-- Bottom Player Bar (aligned to board left & right edges) -->
        <div class="player-bar" id="bot-player-bar">
          <div class="player-id">
            <span class="player-avatar avatar-white" id="bot-avatar">W</span>
            <span id="bot-name" class="player-name">White</span>
            <span id="bot-rating" class="player-rating"></span>
          </div>
          <div id="bot-clock" class="player-clock">--:--</div>
        </div>

      </div>
    </section>

    <!-- ══ Right Analysis Sidebar (Chess.com Layout Structure) ══ -->
    <aside class="right-sidebar">
      <!-- Top Navigation Tabs -->
      <nav class="sidebar-tabs">
        <button class="tab-btn active" data-tab="moves">Moves</button>
        <button class="tab-btn" data-tab="info">Info</button>
        <button class="tab-btn" data-tab="openings">Openings</button>
        <button class="tab-btn" data-tab="games">Games</button>
      </nav>

      <!-- Engine Strip -->
      <div class="engine-strip">
        <span class="engine-badge" id="engine-eval">+0.20</span>
        <span class="engine-name" id="engine-meta">Stockfish 16 · d10</span>
      </div>

      <!-- Opening Subheader Bar (mirrors Chess.com "Starting Position" bar) -->
      <div class="opening-strip" id="opening-strip">
        <span id="opening-banner">Starting Position</span>
        <span id="opening-eco-badge" class="eco-tag"></span>
      </div>

      <!-- Tab 1: MOVES -->
      <div id="tab-moves" class="tab-content active">
        <div class="move-list-scroll" id="move-list-scroll">
          <table id="move-table" class="move-table">
            <tbody id="move-tbody"></tbody>
          </table>
          <div id="empty-moves" class="empty-state">
            No game loaded.<br />Paste PGN/FEN in Info or load Chess.com games.
          </div>
        </div>
      </div>

      <!-- Tab 2: INFO (PGN/FEN Input + Headers) -->
      <div id="tab-info" class="tab-content hidden">
        <div class="tab-scroll-pad">
          <label class="field-label" for="pgn-input">PASTE PGN OR FEN</label>
          <textarea id="pgn-input" class="pgn-textarea" placeholder="Paste PGN or FEN here... (Ctrl+Enter to analyse)"
            rows="8"></textarea>
          <div id="status-msg" class="status-msg"></div>
          <div id="game-headers" class="info-card hidden"></div>
        </div>
      </div>

      <!-- Tab 3: OPENINGS -->
      <div id="tab-openings" class="tab-content hidden">
        <div class="tab-scroll-pad">
          <div id="opening-card" class="info-card">
            <div class="info-row">
              <span class="info-key">ECO CODE</span>
              <span class="info-val" id="opening-eco">—</span>
            </div>
            <div class="info-row">
              <span class="info-key">OPENING NAME</span>
              <span class="info-val" id="opening-name">Starting Position</span>
            </div>
            <div class="info-row">
              <span class="info-key">ENGINE BEST MOVE</span>
              <span class="info-val" id="opening-best">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab 4: GAMES (Chess.com) -->
      <div id="tab-games" class="tab-content hidden">
        <div id="games-list" class="games-list">
          <div class="empty-state">Enter a Chess.com username above to load games.</div>
        </div>
      </div>

      <!-- Bottom Summary + Primary CTA + Playback Controls (Chess.com footer) -->
      <div class="sidebar-footer">
        <div class="quality-summary" id="quality-summary">
          <span><i class="clf-dot clf-best"></i> <b id="cnt-best">0</b> Best</span>
          <span><i class="clf-dot clf-inaccuracy"></i> <b id="cnt-inacc">0</b> Inacc</span>
          <span><i class="clf-dot clf-mistake"></i> <b id="cnt-mistake">0</b> Mistake</span>
          <span><i class="clf-dot clf-blunder"></i> <b id="cnt-blunder">0</b> Blunder</span>
        </div>

        <button id="analyse-btn" class="btn btn-primary">★ Game Review / Analyse</button>

        <div class="nav-controls">
          <button id="btn-start" class="nav-btn" title="Start (Home)">|&lt;</button>
          <button id="btn-prev" class="nav-btn" title="Previous (Left)">&lt;</button>
          <button id="btn-next" class="nav-btn" title="Next (Right)">&gt;</button>
          <button id="btn-end" class="nav-btn" title="End (End)">&gt;|</button>
          <button id="btn-flip" class="nav-btn" title="Flip Board (F)">⇅</button>
        </div>
      </div>
    </aside>

  </main>

  <script src="/static/app.js?v=3"></script>
</body>

</html>
